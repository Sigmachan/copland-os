#
# $UPM_CONF
# /etc/upm.conf
# ~/.config/upm/upm.conf
#
# See the upm.conf(5) manpage for options
#
# Copland build toolchain policy is controlled by UPM_TOOLCHAIN:
#   auto (default) | llvm | gcc | system
# Existing CC/CXX/AR/RANLIB/LD variables always take precedence.

#
# GENERAL OPTIONS
#
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
#AurOnly
#BottomUp
#RemoveMake
#SudoLoop
#UseAsk
#SaveChanges
#CombinedUpgrade
#CleanAfter
#UpgradeMenu
#NewsOnUpgrade

#LocalRepo
#Chroot
#Sign
#SignDb
#KeepRepoCache

#
# Binary OPTIONS
#
#[bin]
#FileManager = vifm
#MFlags = --skippgpcheck
#Sudo = doas
