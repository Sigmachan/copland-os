# Copland OS KDE — SDDM greeter defaults.
# Numlock on (desktop rig), Bibata cursor, Breeze greeter theme. Calamares owns autologin on install;
# the live session autologin is handled by profile.conf (autologin="true").
[General]
Numlock=on
InputMethod=

[Theme]
Current=breeze
CursorTheme=Bibata-Modern-Classic
CursorSize=24
